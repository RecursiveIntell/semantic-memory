<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">semantic-memory durability and recovery model</title>
  <desc id="desc">SQLite with WAL contains authoritative content, embeddings, temporal state, ledgers and search receipts. FTS, vector sidecars, sparse vectors and derived artifacts are projections or acceleration structures. Reconciliation rebuilds projections from SQLite. Replay inputs are stored only by explicit opt-in.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17304A" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="630" rx="24" fill="#07111F"/>
  <rect width="1200" height="630" rx="24" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="62" fill="#E2E8F0" font-size="27" font-weight="700">DURABILITY / RECOVERY / PRIVACY</text>
    <text x="56" y="91" fill="#94A3B8" font-size="14">one authoritative store · rebuildable acceleration · replay text retained only by opt-in</text>

    <!-- connections -->
    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M226 202H318"/>
      <path d="M648 180H748"/>
      <path d="M648 248H748"/>
      <path d="M648 316H748"/>
      <path d="M648 384H748"/>
      <path d="M648 452H748"/>
      <path d="M940 180H1040"/>
      <path d="M940 248H1040"/>
    </g>
    <g fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)">
      <path d="M844 214C844 128 688 114 626 150"/>
      <path d="M844 282C844 502 688 520 626 474"/>
      <path d="M844 350C844 540 688 554 626 486"/>
    </g>

    <!-- Writes -->
    <rect x="56" y="142" width="170" height="120" rx="12" fill="#151E2B" stroke="#94A3B8" stroke-width="2"/>
    <text x="76" y="174" fill="#CBD5E1" font-size="12" font-weight="700">SERIALIZED WRITES</text>
    <text x="76" y="204" fill="#F1F5F9" font-size="16">writer connection</text>
    <text x="76" y="228" fill="#CBD5E1" font-size="13">transaction + WAL</text>
    <text x="76" y="248" fill="#94A3B8" font-size="11">pooled readers stay concurrent</text>

    <!-- SQLite authoritative boundary -->
    <rect x="318" y="122" width="330" height="390" rx="16" fill="#0E251E" stroke="#34D399" stroke-width="2.5"/>
    <text x="342" y="160" fill="#6EE7B7" font-size="13" font-weight="700">AUTHORITATIVE SQLITE</text>
    <text x="342" y="193" fill="#ECFDF5" font-size="21" font-weight="700">memory.db</text>

    <g font-size="13">
      <rect x="342" y="218" width="282" height="48" rx="8" fill="#143529" stroke="#2DD4BF"/>
      <text x="360" y="248" fill="#CCFBF1">facts · documents · chunks</text>
      <rect x="342" y="278" width="282" height="48" rx="8" fill="#143529" stroke="#2DD4BF"/>
      <text x="360" y="308" fill="#CCFBF1">messages · sessions · episodes</text>
      <rect x="342" y="338" width="282" height="48" rx="8" fill="#143529" stroke="#2DD4BF"/>
      <text x="360" y="368" fill="#CCFBF1">raw f32 · valid/recorded time</text>
      <rect x="342" y="398" width="282" height="48" rx="8" fill="#143529" stroke="#2DD4BF"/>
      <text x="360" y="428" fill="#CCFBF1">authority · transition · lineage ledgers</text>
      <rect x="342" y="458" width="282" height="32" rx="8" fill="#28152A" stroke="#F472B6"/>
      <text x="360" y="479" fill="#FBCFE8">search receipts + canonical digests</text>
    </g>

    <!-- Rebuildable surfaces -->
    <rect x="748" y="126" width="192" height="340" rx="16" fill="#0E1E2D" stroke="#38BDF8" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="770" y="160" fill="#7DD3FC" font-size="13" font-weight="700">REBUILDABLE</text>
    <g font-size="14">
      <rect x="770" y="180" width="148" height="48" rx="8" fill="#122A3E" stroke="#38BDF8"/>
      <text x="790" y="210" fill="#E0F2FE">FTS5 indexes</text>
      <rect x="770" y="248" width="148" height="48" rx="8" fill="#122A3E" stroke="#38BDF8"/>
      <text x="790" y="278" fill="#E0F2FE">HNSW sidecar*</text>
      <rect x="770" y="316" width="148" height="48" rx="8" fill="#122A3E" stroke="#38BDF8"/>
      <text x="790" y="346" fill="#E0F2FE">sparse vectors</text>
      <rect x="770" y="384" width="148" height="58" rx="8" fill="#122A3E" stroke="#38BDF8"/>
      <text x="790" y="408" fill="#E0F2FE">candidate artifacts</text>
      <text x="790" y="428" fill="#94A3B8" font-size="11">feature/policy gated</text>
    </g>

    <!-- Operations -->
    <rect x="1040" y="146" width="112" height="70" rx="10" fill="#202016" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="1096" y="176" text-anchor="middle" fill="#FDE68A" font-size="12" font-weight="700">VERIFY</text>
    <text x="1096" y="197" text-anchor="middle" fill="#FEF3C7" font-size="11">Quick / Full</text>

    <rect x="1040" y="224" width="112" height="70" rx="10" fill="#202016" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="1096" y="254" text-anchor="middle" fill="#FDE68A" font-size="12" font-weight="700">RECONCILE</text>
    <text x="1096" y="275" text-anchor="middle" fill="#FEF3C7" font-size="11">report / rebuild</text>

    <!-- Replay privacy -->
    <rect x="748" y="504" width="404" height="80" rx="12" fill="#2A1328" stroke="#F472B6" stroke-width="2"/>
    <text x="770" y="534" fill="#F9A8D4" font-size="13" font-weight="700">V35 REPLAY PRIVACY BOUNDARY</text>
    <text x="770" y="558" fill="#FCE7F3" font-size="13">NoReplay → digests only</text>
    <text x="770" y="578" fill="#FCE7F3" font-size="13">StoreInputs → query + filters retained explicitly</text>

    <text x="56" y="570" fill="#94A3B8" font-size="12">* HNSW journal/replay only; usearch has a separate lifecycle.</text>
  </g>
</svg>
